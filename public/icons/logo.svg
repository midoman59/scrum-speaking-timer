<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 96" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Scrum Speaking Timer</title>
  <desc id="logo-desc">Icône d'un chronomètre surmonté d'une bulle de parole, suivie du nom Scrum Speaking Timer</desc>
  <style>
    .ink { fill: #4338CA; stroke: #4338CA; }
    .ring { fill: none; stroke: #4338CA; }
    .word { fill: #1A202C; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 28px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #A5B4FC; stroke: #A5B4FC; }
      .ring { fill: none; stroke: #A5B4FC; }
      .word { fill: #F3F4F6; }
    }
  </style>
  <defs>
    <!-- Les points de la bulle sont découpés (masque) pour rester lisibles en monochrome -->
    <mask id="logo-dots" maskUnits="userSpaceOnUse" x="0" y="0" width="480" height="96">
      <rect x="0" y="0" width="480" height="96" fill="#FFFFFF"/>
      <circle cx="71" cy="11" r="2.6" fill="#000000"/>
      <circle cx="78" cy="11" r="2.6" fill="#000000"/>
      <circle cx="85" cy="11" r="2.6" fill="#000000"/>
    </mask>
  </defs>

  <!-- Bulle de parole -->
  <path class="ink" mask="url(#logo-dots)" d="M70 0 H86 A8 8 0 0 1 94 8 V14 A8 8 0 0 1 86 22 H76 L68 30 V22 H70 A8 8 0 0 1 62 14 V8 A8 8 0 0 1 70 0 Z"/>

  <!-- Chronomètre : anneau, couronne, tige et aiguille -->
  <circle class="ring" cx="42" cy="58" r="26" stroke-width="8"/>
  <rect class="ink" x="36" y="14" width="12" height="8" rx="2"/>
  <rect class="ink" x="39" y="20" width="6" height="8"/>
  <line x1="42" y1="58" x2="42" y2="42" stroke-width="6" stroke-linecap="round" class="ink"/>
  <circle class="ink" cx="42" cy="58" r="4"/>

  <!-- Nom -->
  <text class="word" x="112" y="58">Scrum Speaking Timer</text>
</svg>
