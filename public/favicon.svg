<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Scrum Speaking Timer">
  <style>
    .ink { fill: #4338CA; stroke: #4338CA; }
    .ring { fill: none; stroke: #4338CA; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #A5B4FC; stroke: #A5B4FC; }
      .ring { fill: none; stroke: #A5B4FC; }
    }
  </style>
  <!-- Bulle de parole -->
  <rect class="ink" x="16" y="0" width="16" height="11" rx="3"/>
  <path class="ink" d="M18 10.5 H22 L19 14 Z"/>
  <!-- Chronomètre : couronne, anneau et aiguille -->
  <rect class="ink" x="9" y="8.5" width="4" height="4"/>
  <circle class="ring" cx="11" cy="21.5" r="7.5" stroke-width="3.5"/>
  <line class="ink" x1="11" y1="21.5" x2="11" y2="15" stroke-width="2.5" stroke-linecap="round"/>
</svg>
