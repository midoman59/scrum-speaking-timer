# Lancement identique sur toute machine disposant de Docker.
#
#   docker compose up dev     -> développement avec rechargement à chaud (http://localhost:4200)
#   docker compose up prod    -> version de production servie par nginx (http://localhost:8080)
#   docker compose run --rm test -> tests unitaires dans Chrome headless

services:
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npx ng serve --host 0.0.0.0 --poll 1000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "4200:4200"

  prod:
    build:
      context: .
      args:
        BASE_HREF: /
    ports:
      - "8080:80"

  test:
    image: node:22-bookworm
    working_dir: /app
    environment:
      CHROME_BIN: /usr/bin/chromium
    command: sh -c "apt-get update && apt-get install -y chromium && npm ci && npx ng test --watch=false --browsers=ChromeHeadlessCI"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
