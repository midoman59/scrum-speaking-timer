server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Route Angular : toute URL inconnue renvoie l'application.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache long pour les fichiers versionnés par le build.
  location ~* \.(js|css|png|ico|svg|webp|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Le service worker et le manifeste ne doivent jamais être mis en cache.
  location ~* (ngsw-worker\.js|ngsw\.json|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
  }
}
