<main class="app-main">
  @if (showStorageRefused()) {
    <app-status-banner variant="warning" (dismissed)="storageRefusedDismissed.set(true)">
      {{ storageRefusedMessage }}
    </app-status-banner>
  }
  @if (showUnreadable()) {
    <app-status-banner variant="warning" (dismissed)="unreadableDismissed.set(true)">
      {{ unreadableMessage }}
    </app-status-banner>
  }
  <router-outlet />
</main>
